[project]
name = "edge-speech-reference"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.3.5"]
desktop = ["PySide6==6.8.3"]
ssh = ["paramiko==3.5.1"]
asr-golden = ["kaldi-native-fbank==1.20.0"]
model-inspection = [
    "numpy==1.26.4",
    "onnx==1.17.0",
    "protobuf==5.29.5",
]
host-ort = [
    "numpy==1.26.4",
    "onnxruntime==1.18.1",
    "protobuf==5.29.5",
    "coloredlogs==15.0.1",
    "flatbuffers==25.12.19",
    "humanfriendly==10.0",
    "mpmath==1.3.0",
    "packaging==26.3",
    "pyreadline3==3.5.6; sys_platform == 'win32'",
    "sympy==1.14.0",
]
host-sherpa = ["sherpa-onnx==1.10.45"]

[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["model_tools"]
